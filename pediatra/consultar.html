<section class="contenido">
    <h1>Consultar citas médicas</h1>

    <form class="formulario" id="formConsulta">

        <label for="nombre">Nombre del niño o niña:</label>
        <input type="text" id="nombre" required>

        <label for="tutor">Nombre del padre, madre o tutor:</label>
        <input type="text" id="tutor" required>

        <label for="fecha">Fecha de la cita:</label>
        <input type="date" id="fecha" required>

        <button class="boton" type="submit">Consultar cita</button>

        <p class="mensaje">
            Si necesitas confirmar los datos de tu cita,
            comunícate con el consultorio.
        </p>

    </form>
</section>
